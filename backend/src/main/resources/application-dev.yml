spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/healthdekho}
    # credentials come from env vars, never commit them
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.healthdekho: DEBUG
