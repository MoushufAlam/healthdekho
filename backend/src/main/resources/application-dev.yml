# Local development profile.
# Credentials come ONLY from environment variables (DB_USERNAME, DB_PASSWORD) - never commit them.

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/healthdekho}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.healthdekho: DEBUG
