spring:
  application:
    name: healthdekho
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  jpa:
    hibernate:
      # schema is owned by Flyway; Hibernate only checks it
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  threads:
    virtual:
      enabled: true

  ai:
    google:
      genai:
        # without a real key the starter still needs a value; our client treats "not-configured" as AI off
        api-key: ${GEMINI_API_KEY:not-configured}
        chat:
          options:
            model: ${GEMINI_MODEL:gemini-2.5-flash}
            temperature: 0.2
    retry:
      # default is 10 attempts; we have our own timeout + fallback, so fail fast
      max-attempts: 2

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

app:
  jwt:
    # blank in dev = random key per start (tokens die on restart); prod requires JWT_SECRET
    secret: ${JWT_SECRET:}
    issuer: healthdekho
    ttl: PT1H
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  ai:
    timeout: PT20S
    max-recommendations: 3
    prompt-version: rec-v1
